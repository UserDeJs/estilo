<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.M. Opera O, o Rei do Fim do Século!</title>
    <style>
        body > p {
            color: blue;
        }
    </style>
</head>
<body>
    <p>Esse parágrafo é azul porque é filho direto de &lt;body&gt;.</p>
    
    <div>
        <p>Esse NÃO ficará azul, pois está dentro de uma &lt;div&gt; (ou seja, é neto do &lt;body&gt;).</p>
    </div>
</body>
</html>
